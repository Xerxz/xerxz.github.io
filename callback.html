<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Authenticating...</title>
    <script type="text/javascript">
        window.onload = function() {
            var redirectUrl = window.location.href;
            
            // Optional: Log the URL to the console for browser debugging
            console.log("Redirecting to: " + redirectUrl); 

            // This line attempts to trigger the deep link handle by the Android OS
            window.location.replace(redirectUrl); 
        };
    </script>
</head>
<body>
    <h1>Authentication Complete</h1>
    <p>Please wait while we redirect you back to the application...</p>
    <p>If you are not automatically redirected, please switch back to the app.</p>
</body>
</html>
