<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xerxz Console</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg: #08090d;
      --surface: #0c0e14;
      --surface-2: #11141d;
      --surface-3: #161a25;
      --border: rgba(255,255,255,0.07);
      --border-2: rgba(255,255,255,0.04);
      --text: #e6e8ef;
      --text-dim: rgba(230,232,239,0.62);
      --text-mute: rgba(230,232,239,0.4);
      --accent: oklch(0.72 0.14 240);
      --accent-soft: oklch(0.72 0.14 240 / 0.14);
      --accent-line: oklch(0.72 0.14 240 / 0.28);
      --good: oklch(0.74 0.14 150);
      --warn: oklch(0.78 0.14 75);
      --bad: oklch(0.7 0.16 25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    .ps-mark {
      display: inline-grid; place-items: center;
      width: 22px; height: 22px; border-radius: 6px;
      background: linear-gradient(135deg, oklch(0.72 0.14 240), oklch(0.6 0.14 260));
      color: #fff; font-weight: 700; font-size: 12px;
      box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.18), 0 1px 2px rgba(0,0,0,0.4);
      font-family: 'Outfit', sans-serif;
    }
    .ps-mark.sm { width: 18px; height: 18px; font-size: 10px; border-radius: 5px; }
    .ps-logo-tag {
      font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-mute);
      padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px;
      margin-left: 4px;
    }
    .mono { font-variant-numeric: tabular-nums; }
    .r { text-align: right; }

    /* ── LOGIN ────────────────────────────────────────────────── */
    .login-root {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .login-aside {
      padding: 48px;
      background: linear-gradient(160deg, oklch(0.18 0.04 250), oklch(0.1 0.02 245));
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .login-mark {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 16px;
    }
    .login-aside-body { max-width: 460px; }
    .login-h {
      font-family: 'Outfit', sans-serif; font-weight: 600;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 16px;
    }
    .login-p { color: var(--text-dim); font-size: 14.5px; margin-bottom: 24px; }
    .login-checks { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .login-checks li {
      display: flex; align-items: center; gap: 10px;
      font-size: 13.5px; color: var(--text-dim);
    }
    .login-foot-aside { color: var(--text-mute); font-size: 12.5px; }
    .login-foot-aside a:hover { color: var(--text); }

    .login-panel {
      padding: 48px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px;
    }
    .login-card {
      width: 100%; max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .login-eyebrow {
      font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent);
    }
    .login-h2 {
      font-family: 'Outfit', sans-serif; font-weight: 600;
      font-size: 22px; letter-spacing: -0.015em;
    }
    .login-sub { color: var(--text-dim); font-size: 13.5px; }
    .login-google {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 10px; padding: 12px; border-radius: 8px;
      background: var(--text); color: #0b0c10;
      border: none; font-weight: 500; font-size: 13.5px;
      transition: opacity 0.15s;
    }
    .login-google:hover:not(:disabled) { background: #fff; }
    .login-google:disabled { opacity: 0.7; cursor: progress; }
    .login-or {
      display: flex; align-items: center; gap: 12px;
      color: var(--text-mute); font-size: 11.5px;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .login-or::before, .login-or::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .login-field { display: flex; flex-direction: column; gap: 6px; }
    .login-field span {
      font-size: 11.5px; font-weight: 500;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--text-mute);
    }
    .login-field input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px; border-radius: 8px;
      font-family: inherit; font-size: 13.5px;
      outline: none; transition: border-color 0.15s;
    }
    .login-field input:focus { border-color: var(--accent-line); }
    .login-secondary {
      padding: 11px; border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text); font-weight: 500; font-size: 13.5px;
      transition: background 0.15s, border-color 0.15s;
    }
    .login-secondary:hover:not(:disabled) {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.14);
    }
    .login-note {
      display: flex; gap: 8px;
      padding: 10px 12px; border-radius: 8px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-line);
      font-size: 12px; color: var(--text-dim); line-height: 1.5;
    }
    .login-note svg { flex-shrink: 0; margin-top: 2px; }
    .login-foot {
      display: flex; gap: 8px; align-items: center;
      color: var(--text-mute); font-size: 12px;
    }
    .login-foot a:hover { color: var(--text); }

    @media (max-width: 820px) {
      .login-root { grid-template-columns: 1fr; }
      .login-aside { padding: 32px 24px; }
      .login-panel { padding: 32px 24px; }
    }

    /* ── DASHBOARD SHELL ──────────────────────────────────────── */
    .dx-root {
      display: grid;
      grid-template-columns: 232px 1fr;
      min-height: 100vh;
    }

    /* Sidebar */
    .dx-side {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 16px 12px;
      gap: 14px;
      position: sticky; top: 0; height: 100vh;
    }
    .dx-side-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 8px 12px;
      border-bottom: 1px solid var(--border-2);
    }
    .dx-brand-t {
      font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px;
    }
    .dx-brand-s {
      font-size: 11px; color: var(--text-mute); letter-spacing: 0.02em;
    }
    .dx-nav {
      display: flex; flex-direction: column; gap: 2px;
      flex: 1; overflow-y: auto;
    }
    .dx-nav-h {
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-mute);
      padding: 14px 8px 4px;
    }
    .dx-nav-h:first-child { padding-top: 4px; }
    .dx-nav-i {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 8px;
      background: transparent; border: none;
      color: var(--text-dim);
      font-size: 13px; font-weight: 500;
      border-radius: 6px;
      transition: background 0.12s, color 0.12s;
      text-align: left;
    }
    .dx-nav-i:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .dx-nav-i.on {
      background: var(--surface-2);
      color: var(--text);
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .dx-nav-i > span:first-of-type { flex: 1; }
    .dx-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent);
      font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .dx-badge.warn { background: oklch(0.7 0.16 25 / 0.14); color: var(--bad); }
    .dx-side-foot {
      padding-top: 12px; border-top: 1px solid var(--border-2);
    }
    .dx-user {
      display: flex; align-items: center; gap: 10px;
      padding: 6px;
    }
    .dx-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, oklch(0.72 0.14 240), oklch(0.6 0.14 290));
      color: #fff; font-weight: 600; font-size: 11px;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .dx-user-meta { flex: 1; min-width: 0; overflow: hidden; }
    .dx-user-n {
      font-size: 12.5px; font-weight: 500; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dx-user-e {
      font-size: 11px; color: var(--text-mute);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dx-icon-btn {
      background: transparent; border: none;
      width: 26px; height: 26px;
      display: grid; place-items: center;
      color: var(--text-mute); border-radius: 6px;
      transition: background 0.12s, color 0.12s;
    }
    .dx-icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }

    /* Main */
    .dx-main { display: flex; flex-direction: column; min-width: 0; }

    .dx-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 24px;
      background: rgba(8,9,13,0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      gap: 16px; flex-wrap: wrap;
      position: sticky; top: 0; z-index: 50;
    }
    .dx-crumb {
      display: flex; align-items: center; gap: 6px;
      font-size: 12.5px; color: var(--text-mute);
    }
    .dx-crumb-cur { color: var(--text); font-weight: 500; }
    .dx-top-r { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .dx-seg {
      display: inline-flex; padding: 2px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; gap: 1px;
    }
    .dx-seg button {
      background: transparent; border: none; color: var(--text-dim);
      font-size: 12px; font-weight: 500;
      padding: 5px 10px; border-radius: 5px;
      transition: background 0.12s, color 0.12s;
    }
    .dx-seg button:hover { color: var(--text); }
    .dx-seg button.on {
      background: var(--surface-2); color: var(--text);
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .dx-select {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 12.5px;
      padding: 6px 10px; padding-right: 24px; border-radius: 7px;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(230,232,239,0.5)' d='M0 0h10L5 6z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
      cursor: pointer;
    }
    .dx-toggle, .dx-btn-ghost, .dx-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 11px; border-radius: 7px;
      font-size: 12.5px; font-weight: 500; line-height: 1;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      border: 1px solid var(--border);
    }
    .dx-toggle {
      background: var(--surface); color: var(--text-dim);
    }
    .dx-toggle.on {
      background: var(--accent-soft); color: var(--accent);
      border-color: var(--accent-line);
    }
    .dx-btn-ghost {
      background: var(--surface); color: var(--text);
    }
    .dx-btn-ghost:hover {
      background: var(--surface-2); border-color: rgba(255,255,255,0.14);
    }
    .dx-btn {
      background: var(--text); color: #0b0c10; border-color: transparent;
    }
    .dx-btn:hover { background: #fff; }
    .dx-link-btn {
      background: transparent; border: none;
      color: var(--accent); font-size: 12px; font-weight: 500;
      padding: 4px 6px; border-radius: 5px;
      transition: background 0.12s;
    }
    .dx-link-btn:hover { background: var(--accent-soft); }

    @keyframes dx-spin { to { transform: rotate(360deg); } }

    .dx-page { padding: 20px 24px 64px; display: flex; flex-direction: column; gap: 20px; }

    /* Anomaly bar */
    .dx-anom-bar {
      display: flex; align-items: center; gap: 18px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      flex-wrap: wrap;
    }
    .dx-anom-l { display: flex; align-items: center; gap: 8px; }
    .dx-anom-h {
      font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-mute);
    }
    .dx-anom-list { display: flex; gap: 16px; flex: 1; flex-wrap: wrap; }
    .dx-anom {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12.5px; color: var(--text);
    }
    .dx-anom-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--bad);
    }
    .dx-sev-med .dx-anom-dot { background: var(--warn); }
    .dx-sev-good .dx-anom-dot { background: var(--good); }
    .dx-anom-t { font-weight: 500; }
    .dx-anom-when { color: var(--text-mute); font-size: 11.5px; }

    /* KPIs */
    .dx-kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .dx-kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex; flex-direction: column; gap: 4px;
      min-width: 0;
    }
    .dx-kpi-l {
      font-size: 11.5px; font-weight: 500;
      color: var(--text-mute);
      letter-spacing: 0.02em;
    }
    .dx-kpi-v {
      font-family: 'Outfit', sans-serif; font-weight: 600;
      font-size: 22px; letter-spacing: -0.015em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .dx-kpi-row { display: flex; align-items: baseline; gap: 6px; }
    .dx-kpi-sub { font-size: 11px; color: var(--text-mute); }
    .dx-kpi-spark {
      margin-top: 6px; height: 32px;
    }
    .dx-kpi-foot {
      font-size: 11px; color: var(--text-mute);
      margin-top: 2px;
    }

    /* Grids */
    .dx-grid-2 {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .dx-grid-3 {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    /* Card */
    .dx-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex; flex-direction: column;
      min-width: 0;
    }
    .dx-card.dense .dx-card-h { padding: 10px 14px; }
    .dx-card.dense .dx-card-b { padding: 0 14px 14px; }
    .dx-card-h {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 14px 16px; gap: 12px;
      border-bottom: 1px solid var(--border-2);
    }
    .dx-card-t {
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px; font-weight: 600; color: var(--text);
    }
    .dx-card-s {
      font-size: 11.5px; color: var(--text-mute);
      margin-top: 2px;
    }
    .dx-card-act { display: flex; gap: 6px; align-items: center; }
    .dx-card-b { padding: 16px; }

    /* Table */
    .dx-table {
      width: 100%; border-collapse: collapse;
      font-size: 12.5px;
    }
    .dx-table th {
      text-align: left; font-weight: 500;
      color: var(--text-mute); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.04em;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    .dx-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border-2);
      color: var(--text-dim);
    }
    .dx-table tbody tr:last-child td { border-bottom: none; }
    .dx-table.compact td, .dx-table.compact th { padding: 6px 8px; }
    .dx-row-clickable { cursor: pointer; transition: background 0.12s; }
    .dx-row-clickable:hover { background: rgba(255,255,255,0.025); }
    .dx-cell-app {
      display: flex; align-items: center; gap: 10px;
    }
    .dx-cell-name { font-weight: 500; color: var(--text); }
    .dx-cell-cat { font-size: 11px; color: var(--text-mute); }
    .dx-monet { font-size: 12px; color: var(--text-dim); }

    /* Meters */
    .dx-meters { display: flex; flex-direction: column; gap: 14px; }
    .dx-meter { display: flex; flex-direction: column; gap: 5px; }
    .dx-meter-h {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--text-dim);
    }
    .dx-meter-b {
      position: relative; height: 6px;
      background: rgba(255,255,255,0.04);
      border-radius: 3px;
    }
    .dx-meter-fill {
      position: absolute; top: 0; left: 0; height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .dx-meter-target {
      position: absolute; top: -2px; height: 10px;
      width: 1.5px;
      background: rgba(255,255,255,0.4);
    }
    .dx-meter-f {
      font-size: 11px; color: var(--text-mute);
    }
    .dx-legend {
      display: flex; gap: 14px;
      margin-top: 10px;
      font-size: 11.5px; color: var(--text-mute);
    }
    .dx-leg-d {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 2px; vertical-align: middle;
      margin-right: 5px;
    }
    .dx-leg-d.blue { background: oklch(0.72 0.14 240); }
    .dx-leg-d.gray { background: rgba(230,232,239,0.18); }

    /* Reviews */
    .dx-reviews {
      list-style: none;
      display: flex; flex-direction: column; gap: 0;
    }
    .dx-review {
      display: flex; gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-2);
    }
    .dx-review:last-child { border-bottom: none; }
    .dx-review.sent-pos { border-left: 2px solid var(--good); padding-left: 12px; margin-left: -14px; }
    .dx-review.sent-neg { border-left: 2px solid var(--bad);  padding-left: 12px; margin-left: -14px; }
    .dx-review.sent-neu { border-left: 2px solid var(--text-mute); padding-left: 12px; margin-left: -14px; }
    .dx-review-body { flex: 1; min-width: 0; }
    .dx-review-head {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; margin-bottom: 4px;
    }
    .dx-review-name { font-weight: 500; color: var(--text); }
    .dx-review-stars { display: inline-flex; gap: 1px; }
    .dx-review-when { color: var(--text-mute); font-size: 11px; margin-left: auto; }
    .dx-review-text { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }

    /* Anomaly feed */
    .dx-anom-feed { list-style: none; display: flex; flex-direction: column; }
    .dx-anom-item {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      gap: 14px; align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--border-2);
      cursor: pointer;
      transition: background 0.12s;
    }
    .dx-anom-item:last-child { border-bottom: none; }
    .dx-anom-item:hover { background: rgba(255,255,255,0.02); }
    .dx-anom-icon {
      width: 30px; height: 30px;
      display: grid; place-items: center;
      border-radius: 8px;
      background: oklch(0.7 0.16 25 / 0.12);
      color: var(--bad);
    }
    .dx-sev-med .dx-anom-icon { background: oklch(0.78 0.14 75 / 0.12); color: var(--warn); }
    .dx-sev-good .dx-anom-icon { background: oklch(0.74 0.14 150 / 0.12); color: var(--good); }
    .dx-anom-meta { min-width: 0; }
    .dx-anom-title { font-size: 13px; font-weight: 500; color: var(--text); }
    .dx-anom-detail { font-size: 12px; color: var(--text-dim); margin-top: 2px; line-height: 1.45; }
    .dx-anom-side { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }

    /* Stat row */
    .dx-stat-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .dx-stat-row > div { display: flex; flex-direction: column; gap: 2px; }
    .dx-stat-row b {
      font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600;
      color: var(--text); font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    .dx-stat-row.big b { font-size: 26px; }
    .dx-stat-row span { font-size: 11px; color: var(--text-mute); letter-spacing: 0.02em; }

    /* Sync */
    .dx-sync { list-style: none; display: flex; flex-direction: column; }
    .dx-sync-i {
      display: grid; grid-template-columns: auto 1fr auto auto;
      gap: 14px; align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-2);
    }
    .dx-sync-i:last-child { border-bottom: none; }
    .dx-sync-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 8px var(--good);
    }
    .dx-sync-dot.st-error   { background: var(--bad);  box-shadow: 0 0 8px var(--bad); }
    .dx-sync-dot.st-pending { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: dx-spin 1.4s linear infinite; border-radius: 2px; }
    .dx-sync-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .dx-sync-d { font-size: 11.5px; color: var(--text-mute); margin-top: 1px; }
    .dx-sync-time { font-size: 11.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .dx-sync-i.st-error .dx-sync-time { color: var(--bad); }

    /* Inline bar */
    .dx-inline-bar {
      position: relative; height: 5px;
      background: rgba(255,255,255,0.04); border-radius: 3px;
      overflow: hidden;
    }
    .dx-inline-bar > div {
      position: absolute; left: 0; top: 0; height: 100%;
      border-radius: 3px;
    }
    .dx-flag { font-size: 14px; margin-right: 4px; }

    /* Drilldown drawer */
    .dx-drawer-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 200;
      animation: dxFade 0.2s ease;
    }
    @keyframes dxFade { from { opacity: 0; } to { opacity: 1; } }
    .dx-drawer {
      position: fixed; right: 0; top: 0; bottom: 0;
      width: min(560px, 92vw);
      background: var(--bg);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      animation: dxSlide 0.25s ease;
      box-shadow: -16px 0 40px rgba(0,0,0,0.4);
    }
    @keyframes dxSlide { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .dx-drawer-h {

      border-bottom: 1px solid var(--border);

    .dx-drawer-s {

  <script type="text/babel" data-presets="env,react">
const C = {
  blue:    'oklch(0.72 0.14 240)',
  blueDim: 'oklch(0.72 0.14 240 / 0.18)',
  blueGhost:'oklch(0.72 0.14 240 / 0.06)',

  inkMute: 'rgba(230,232,239,0.32)',
  line:    'rgba(255,255,255,0.06)',
  lineSoft:'rgba(255,255,255,0.04)',
};

const palette = [C.blue, C.green, C.amber, C.violet, C.red,
  'oklch(0.74 0.13 200)','oklch(0.72 0.13 130)','oklch(0.7 0.13 320)',
  'oklch(0.78 0.12 60)','oklch(0.66 0.13 250)','oklch(0.7 0.13 100)','oklch(0.72 0.13 350)'];

function fmtMoney(n){
  if(n==null||isNaN(n)) return '0 kr';
  if(Math.abs(n)>=1e6) return (n/1e6).toFixed(2)+'M kr';
  if(Math.abs(n)>=1e3) return (n/1e3).toFixed(1)+'k kr';
  return n.toFixed(0)+' kr';
}
function fmtNum(n){
  if(n==null||isNaN(n)) return '0';
  if(Math.abs(n)>=1e6) return (n/1e6).toFixed(2)+'M';
  if(Math.abs(n)>=1e3) return (n/1e3).toFixed(1)+'k';
  return n.toFixed(0);
}
function fmtPct(n,d=2){ return (n*100).toFixed(d)+'%'; }

function pathFromSeries(values, w, h, padTop=4, padBot=2){
  if(!values.length) return '';
  const max = Math.max(...values, 1e-9);
  const min = 0;
  const range = max - min || 1;
  const stepX = w / Math.max(1, values.length-1);
  return values.map((v,i)=>{
    const x = i*stepX;
    const y = padTop + (h - padTop - padBot) * (1 - (v-min)/range);
    return (i===0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2);
  }).join(' ');
}

function areaFromSeries(values, w, h, padTop=4, padBot=2){
  if(!values.length) return '';
  const line = pathFromSeries(values, w, h, padTop, padBot);
  return line + ` L${w.toFixed(2)},${(h-padBot).toFixed(2)} L0,${(h-padBot).toFixed(2)} Z`;
}

function LineChart({ series, comparison, height=180, formatter, gridY=4 }){
  const fmt = formatter || fmtNum;
  const W = 100, H = height;
  const ref = React.useRef(null);
  const [hover, setHover] = React.useState(null);
  const all = [...series, ...(comparison||[])];
  const len = series[0]?.values.length || 1;

  const onMove = (e)=>{
    const r = ref.current.getBoundingClientRect();
    const x = e.clientX - r.left;
    const i = Math.round((x/r.width) * (len-1));
    setHover({ i: Math.max(0, Math.min(len-1, i)) });
  };
  const onLeave = ()=>setHover(null);

  return (
    <div ref={ref} style={{position:'relative', width:'100%', height:H}}
         onMouseMove={onMove} onMouseLeave={onLeave}>
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none"
           style={{position:'absolute', inset:0, width:'100%', height:'100%', overflow:'visible'}}>
        {Array.from({length:gridY+1}).map((_,i)=>{
          const y = (H-2)*(i/gridY)+2;
          return <line key={i} x1="0" x2={W} y1={y} y2={y} stroke={C.line} strokeWidth=".5" vectorEffect="non-scaling-stroke"/>;
        })}
        <defs>
          {series.map((s,si)=>(
            <linearGradient key={si} id={`grad-${si}-${s.label.replace(/\s/g,'')}`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={s.color||C.blue} stopOpacity="0.28"/>
              <stop offset="100%" stopColor={s.color||C.blue} stopOpacity="0"/>
            </linearGradient>
          ))}
        </defs>
        {(comparison||[]).map((s,i)=>(
          <path key={'c'+i} d={pathFromSeries(s.values, W, H)}
                stroke={C.inkMute} strokeDasharray="2 2" strokeWidth="1" fill="none"
                vectorEffect="non-scaling-stroke" />
        ))}
        {series.map((s,si)=>(
          <g key={si}>
            <path d={areaFromSeries(s.values, W, H)} fill={`url(#grad-${si}-${s.label.replace(/\s/g,'')})`}/>
            <path d={pathFromSeries(s.values, W, H)} stroke={s.color||C.blue} strokeWidth="1.25" fill="none"
                  strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>
          </g>
        ))}
        {hover && (
          <line x1={(hover.i/(len-1))*W} x2={(hover.i/(len-1))*W} y1="0" y2={H}
                stroke="rgba(255,255,255,0.18)" strokeWidth="1" vectorEffect="non-scaling-stroke"/>
        )}
        {hover && series.map((s,si)=>{
          const v = s.values[hover.i];
          const max = Math.max(...s.values, 1e-9);
          const x = (hover.i/(len-1))*W;
          const y = 4 + (H - 6) * (1 - v/max);
          return <circle key={si} cx={x} cy={y} r="2.4" fill={s.color||C.blue} stroke="#0b0c10" strokeWidth=".8" vectorEffect="non-scaling-stroke"/>;
        })}
      </svg>
      {hover && (
        <div style={{
          position:'absolute',
          left: `min(calc(100% - 168px), max(0px, ${(hover.i/(len-1))*100}% - 80px))`,
          top: 4,
          background:'rgba(14,16,22,0.95)', border:'1px solid rgba(255,255,255,0.08)',
          borderRadius:8, padding:'8px 10px', fontSize:11, lineHeight:1.45,
          pointerEvents:'none', minWidth:160,
          boxShadow:'0 8px 24px rgba(0,0,0,.4)',
        }}>
          <div style={{color:C.inkDim, fontSize:10, marginBottom:4, letterSpacing:'.04em', textTransform:'uppercase'}}>Day {hover.i+1}</div>
          {series.map((s,si)=>(
            <div key={si} style={{display:'flex', justifyContent:'space-between', gap:12, color:C.ink}}>
              <span style={{display:'flex', alignItems:'center', gap:6}}>
                <span style={{display:'inline-block', width:8, height:2, background:s.color||C.blue, borderRadius:1}}/>
                {s.label}
              </span>
              <b style={{fontVariantNumeric:'tabular-nums', fontWeight:500}}>{fmt(s.values[hover.i])}</b>
            </div>
          ))}
          {comparison && comparison.map((s,si)=>(
            <div key={'c'+si} style={{display:'flex', justifyContent:'space-between', gap:12, color:C.inkDim}}>
              <span>{s.label}</span>
              <span style={{fontVariantNumeric:'tabular-nums'}}>{fmt(s.values[hover.i])}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function BarChartH({ rows, max, formatter, accent=C.blue, height=180 }){
  const fmt = formatter || fmtMoney;
  const m = max || Math.max(...rows.map(r=>r.value), 1e-9);
  return (
    <div style={{display:'flex', flexDirection:'column', gap:6}}>
      {rows.map((r,i)=>(
        <div key={i} style={{display:'grid', gridTemplateColumns:'112px 1fr 64px', gap:10, alignItems:'center', fontSize:12}}>
          <div style={{color:C.ink, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}} title={r.label}>{r.label}</div>
          <div style={{position:'relative', height:8, background:'rgba(255,255,255,0.04)', borderRadius:2}}>
            <div style={{
              position:'absolute', inset:0, right:'auto',
              width: (r.value/m*100)+'%',
              background: r.color || accent,
              borderRadius:2,
              transition:'width .35s cubic-bezier(.3,.7,.4,1)'
            }}/>
          </div>
          <div style={{textAlign:'right', color:C.inkDim, fontVariantNumeric:'tabular-nums'}}>{fmt(r.value)}</div>
        </div>
      ))}
    </div>
  );
}

function ColumnChart({ rows, height=140, formatter }){
  const fmt = formatter || fmtNum;
  const max = Math.max(...rows.flatMap(r=>[r.a, r.b||0]), 1e-9);
  return (
    <div style={{display:'flex', alignItems:'flex-end', gap:6, height, padding:'0 2px'}}>
      {rows.map((r,i)=>(
        <div key={i} style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:4, height:'100%'}}>
          <div style={{flex:1, width:'100%', display:'flex', alignItems:'flex-end', gap:2}}>
            <div style={{flex:1, height:(r.a/max*100)+'%', background:C.blue, borderRadius:'2px 2px 0 0', minHeight:1, transition:'height .35s'}}/>
            {r.b!=null && <div style={{flex:1, height:(r.b/max*100)+'%', background:'rgba(230,232,239,0.18)', borderRadius:'2px 2px 0 0', minHeight:1, transition:'height .35s'}}/>}
          </div>
          <div style={{fontSize:9.5, color:C.inkMute, letterSpacing:'.04em'}}>{r.label}</div>
        </div>
      ))}
    </div>
  );
}

function Sparkline({ values, color=C.blue, height=32, width=80, fill=true }){
  const W=100, H=height;
  const id = `sl-${color.replace(/[^a-z0-9]/gi,'')}-${Math.random().toString(36).slice(2,7)}`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none"
         style={{width: width || '100%', height, display:'block', overflow:'visible'}}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity=".3"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      {fill && <path d={areaFromSeries(values, W, H, 2, 2)} fill={`url(#${id})`}/>}
      <path d={pathFromSeries(values, W, H, 2, 2)} stroke={color} strokeWidth="1.4" fill="none"
            strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>
    </svg>
  );
}

function Heatmap({ rows, cols, values, formatter }){
  const fmt = formatter || fmtPct;
  const max = Math.max(...values.flat().filter(v => v != null), 1e-9);
  return (
    <div style={{display:'grid', gridTemplateColumns:`80px repeat(${cols.length}, 1fr)`, gap:2, fontSize:10.5}}>
      <div/>
      {cols.map((c,i)=>(
        <div key={i} style={{textAlign:'center', color:C.inkMute, padding:'2px 0', letterSpacing:'.04em'}}>{c}</div>
      ))}
      {rows.map((r,i)=>(
        <React.Fragment key={i}>
          <div style={{color:C.inkDim, padding:'4px 6px 4px 0', textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{r}</div>
          {cols.map((c,j)=>{
            const v = values[i][j];
            const t = v==null ? 0 : v/max;
            return (
              <div key={j} title={v==null?'—':fmt(v)} style={{
                background: v==null ? 'transparent' : `oklch(0.72 ${0.06+0.10*t} 240 / ${0.08+0.55*t})`,
                color: t>0.55 ? '#0b0c10' : C.ink,
                borderRadius:3, padding:'5px 4px', textAlign:'center', fontVariantNumeric:'tabular-nums',
                border: v==null ? '1px dashed rgba(255,255,255,0.05)' : '1px solid rgba(255,255,255,0.04)'
              }}>{v==null?'—':fmt(v,0)}</div>
            );
          })}
        </React.Fragment>
      ))}
    </div>
  );
}

Object.assign(window, { LineChart, BarChartH, ColumnChart, Sparkline, Heatmap, fmtMoney, fmtNum, fmtPct, ChartC: C, palette, pathFromSeries, areaFromSeries });
  </script>

  <script type="text/babel" data-presets="env,react">
function LoginScreen({ onSignIn, onBack }){
  const [loading, setLoading] = React.useState(false);
  const [error, setError]   = React.useState(null);

  const handleGoogle = () => {
    const cfg = window.CONFIG;
    if (cfg.clientId.startsWith('REPLACE')) {
      setError('Client ID not configured. Set CONFIG.clientId in console.html.');
      return;
    }
    if (!window.google?.accounts?.oauth2) {
      setError('Google Identity Services not loaded — check your connection.');
      return;
    }
    setLoading(true);
    setError(null);
    const client = google.accounts.oauth2.initTokenClient({
      client_id: cfg.clientId,
      scope: [
        'openid','email','profile',
        'https://www.googleapis.com/auth/androidpublisher',
        'https://www.googleapis.com/auth/admob.readonly',
        'https://www.googleapis.com/auth/playdeveloperreporting',
      ].join(' '),
      callback: async (resp) => {
        if (resp.error) {
          setLoading(false);
          if (resp.error !== 'access_denied')
            setError('Sign-in failed: ' + (resp.error_description || resp.error));
          return;
        }
        try {
          const info = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
            headers: { Authorization: `Bearer ${resp.access_token}` }
          }).then(r => r.json());
          const allowed = cfg.allowedEmails;
          if (allowed.length > 0 && !allowed.includes(info.email)) {
            setLoading(false);
            setError(`Access denied. ${info.email} is not on the allowlist.`);
            return;
          }
          onSignIn({ name: info.name || info.email, email: info.email, picture: info.picture, token: resp.access_token });
        } catch(e) {
          setLoading(false);
          setError('Failed to verify identity: ' + e.message);
        }
      },
    });
    client.requestAccessToken({ prompt: '' });
  };

  return (
    <div className="login-root">
      <div className="login-aside">
        <div className="login-mark">
          <span className="ps-mark">X</span>
          <span>Xerxz</span>
          <span className="ps-logo-tag">Console</span>
        </div>
        <div className="login-aside-body">
          <h1 className="login-h">A small studio's command center.</h1>
          <p className="login-p">Live revenue, installs, ratings, ads, and crashes — synced from Play Console and AdMob, kept private behind your Google account.</p>
          <ul className="login-checks">
            <li><Icon name="check" size={14} color="oklch(0.74 0.14 150)"/> Owner-only access by allowlisted email</li>
            <li><Icon name="check" size={14} color="oklch(0.74 0.14 150)"/> OAuth token stays in browser memory only</li>
            <li><Icon name="check" size={14} color="oklch(0.74 0.14 150)"/> Direct calls to Google APIs — no proxy</li>
          </ul>
        </div>
        <div className="login-foot-aside">
          <a href="#" onClick={(e)=>{e.preventDefault();onBack();}}>← Back to xerxz.app</a>
        </div>
      </div>
      <div className="login-panel">
        <div className="login-card">
          <div className="login-eyebrow">Restricted area</div>
          <h2 className="login-h2">Sign in to the dashboard</h2>
          <p className="login-sub">Use the Google account associated with your developer profile.</p>
          <button className="login-google" onClick={handleGoogle} disabled={loading}>
            <Icon name="google" size={18} color="#0b0c10"/>
            {loading ? 'Signing in…' : 'Continue with Google'}
          </button>
          {error && (
            <div className="login-note" style={{background:'oklch(0.7 0.16 25 / 0.12)',borderColor:'oklch(0.7 0.16 25 / 0.3)'}}>
              <Icon name="warning" size={13} color="oklch(0.7 0.16 25)"/>
              <span style={{color:'oklch(0.88 0.08 25)'}}>{error}</span>
            </div>
          )}
          <div className="login-note">
            <Icon name="shield" size={13} color="oklch(0.72 0.14 240)"/>
            <span>Sign in with the Google account linked to your Play Console and AdMob. Tokens are held in browser memory and cleared on sign-out.</span>
          </div>
        </div>
        <div className="login-foot">
          <a href="#">Privacy</a><span>·</span>
          <a href="#">Security</a><span>·</span>
          <a href="#">Status</a>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { LoginScreen });
  </script>

  <script type="text/babel" data-presets="env,react">
const DATE_RANGES = [
  { id:'today', label:'Today', days:1 },
  { id:'yest',  label:'Yesterday', days:1 },
  { id:'7d',    label:'7d', days:7 },
  { id:'30d',   label:'30d', days:30 },
  { id:'mtd',   label:'Month', days:29 },
  { id:'90d',   label:'90d', days:90 },
];

function sumRange(values, days){ return values.slice(-days).reduce((s,v)=>s+v, 0); }
function sumRangePrev(values, days){ return values.slice(-days*2, -days).reduce((s,v)=>s+v, 0); }
function avgRange(values, days){
  const slice = values.slice(-days);
  return slice.reduce((s,v)=>s+v,0)/Math.max(1,slice.length);
}
function aggregateApps(apps, key, days){
  const out = new Array(days).fill(0);
  apps.forEach(a=>{
    const s = a.series[key].slice(-days);
    s.forEach((v,i)=> out[i]+=v);
  });
  return out;
}

function Dashboard({ user, onSignOut, onBackToSite, dataLoading }){
  const [range, setRange] = React.useState('30d');
  const [appFilter, setAppFilter] = React.useState('all');
  const [platform, setPlatform] = React.useState('all');
  const [source, setSource] = React.useState('all');
  const [tab, setTab] = React.useState('overview');
  const [drilldown, setDrilldown] = React.useState(null);
  const [refreshing, setRefreshing] = React.useState(false);
  const [compare, setCompare] = React.useState(true);

  const days = DATE_RANGES.find(r=>r.id===range)?.days || 30;

  const apps = React.useMemo(()=>{
    let list = window.XZ.APPS;
    if(platform!=='all') list = list.filter(a=>a.platforms.includes(platform));
    if(appFilter!=='all') list = list.filter(a=>a.id===appFilter);
    return list;
  },[platform, appFilter]);

  const totalRev   = React.useMemo(()=> sumRange(aggregateApps(apps,'revenue',days), days), [apps,days]);
  const totalRevP  = React.useMemo(()=> sumRangePrev(aggregateApps(apps,'revenue',days*2), days), [apps,days]);
  const admob      = React.useMemo(()=> sumRange(aggregateApps(apps,'admob',days), days), [apps,days]);
  const admobP     = React.useMemo(()=> sumRangePrev(aggregateApps(apps,'admob',days*2), days), [apps,days]);
  const play       = React.useMemo(()=> sumRange(aggregateApps(apps,'play',days), days), [apps,days]);
  const installs   = React.useMemo(()=> sumRange(aggregateApps(apps,'installs',days), days), [apps,days]);
  const installsP  = React.useMemo(()=> sumRangePrev(aggregateApps(apps,'installs',days*2), days), [apps,days]);
  const dau        = React.useMemo(()=> apps.reduce((s,a)=>s+a.dau,0), [apps]);
  const ratingAvg  = React.useMemo(()=> apps.reduce((s,a)=>s+a.rating,0)/Math.max(1,apps.length), [apps]);
  const crash      = React.useMemo(()=> avgRange(aggregateApps(apps,'crashRate',days).map(v=>v/Math.max(1,apps.length)), days), [apps,days]);
  const impr       = React.useMemo(()=> sumRange(aggregateApps(apps,'impr',days), days), [apps,days]);
  const ecpm       = React.useMemo(()=> admob / Math.max(1, impr) * 1000, [admob, impr]);

  const revSeries  = aggregateApps(apps,'revenue',days);
  const installsSeries = aggregateApps(apps,'installs',days);
  const installsSeriesP= aggregateApps(apps,'installs',days*2).slice(0, days);

  const onRefresh = ()=>{
    setRefreshing(true);
    setTimeout(()=>setRefreshing(false), 1100);
  };

  return (
    <div className="dx-root">
      <DxSidebar tab={tab} setTab={setTab} user={user} onSignOut={onSignOut} onBackToSite={onBackToSite}/>
      <div className="dx-main">
        <DxTopbar tab={tab}
                  range={range} setRange={setRange}
                  appFilter={appFilter} setAppFilter={setAppFilter}
                  platform={platform} setPlatform={setPlatform}
                  source={source} setSource={setSource}
                  compare={compare} setCompare={setCompare}
                  refreshing={refreshing} onRefresh={onRefresh}
                  dataLoading={dataLoading}/>
        <div className="dx-page">
          {tab==='overview' && (
            <Overview {...{apps, days, totalRev, totalRevP, admob, admobP, play, installs, installsP, dau, ratingAvg, crash, impr, ecpm, revSeries, installsSeries, installsSeriesP, compare, setDrilldown}}/>
          )}
          {tab==='apps' && <AppsTable apps={window.XZ.APPS} days={days} onSelect={setDrilldown}/>}
          {tab==='ads' && <AdsView apps={apps} days={days}/>}
          {tab==='reviews' && <ReviewsView/>}
          {tab==='anomalies' && <AnomaliesView onSelect={setDrilldown}/>}
          {tab==='cohort' && <CohortView/>}
          {tab==='sync' && <SyncView/>}
        </div>
      </div>
      {drilldown && <Drilldown app={window.XZ.APPS.find(a=>a.id===drilldown)} days={days} onClose={()=>setDrilldown(null)}/>}
    </div>
  );
}

function DxSidebar({ tab, setTab, user, onSignOut, onBackToSite }){
  const items = [
    { id:'overview',  icon:'chart',    label:'Overview' },
    { id:'apps',      icon:'apps',     label:'Apps' },
    { id:'ads',       icon:'dollar',   label:'Ad units' },
    { id:'reviews',   icon:'star',     label:'Reviews' },
    { id:'anomalies', icon:'warning',  label:'Anomalies', badge:3 },
    { id:'cohort',    icon:'grid',     label:'Cohorts' },
    { id:'sync',      icon:'refresh',  label:'Sync status', badge:'!' },
  ];
  return (
    <aside className="dx-side">
      <div className="dx-side-brand">
        <span className="ps-mark sm">X</span>
        <div>
          <div className="dx-brand-t">Xerxz</div>
          <div className="dx-brand-s">Console · v3.4</div>
        </div>
      </div>
      <nav className="dx-nav">
        <div className="dx-nav-h">Workspace</div>
        {items.map(it=>(
          <button key={it.id} className={'dx-nav-i '+(tab===it.id?'on':'')} onClick={()=>setTab(it.id)}>
            <Icon name={it.icon} size={15}/>
            <span>{it.label}</span>
            {it.badge && <span className={'dx-badge '+(it.badge==='!'?'warn':'')}>{it.badge}</span>}
          </button>
        ))}
        <div className="dx-nav-h">Configuration</div>
        <button className="dx-nav-i"><Icon name="settings" size={15}/><span>Connections</span></button>
        <button className="dx-nav-i"><Icon name="user" size={15}/><span>Allowlist</span></button>
        <button className="dx-nav-i" onClick={onBackToSite}><Icon name="external" size={15}/><span>Public site</span></button>
      </nav>
      <div className="dx-side-foot">
        <div className="dx-user">
          {user.picture
            ? <img src={user.picture} style={{width:28,height:28,borderRadius:'50%',flexShrink:0,objectFit:'cover'}} referrerPolicy="no-referrer"/>
            : <div className="dx-avatar">{user.name.split(' ').map(n=>n[0]).join('')}</div>
          }
          <div className="dx-user-meta">
            <div className="dx-user-n">{user.name}</div>
            <div className="dx-user-e">{user.email}</div>
          </div>
          <button className="dx-icon-btn" onClick={onSignOut} title="Sign out"><Icon name="external" size={13}/></button>
        </div>
      </div>
    </aside>
  );
}

function DxTopbar({ tab, range, setRange, appFilter, setAppFilter, platform, setPlatform, source, setSource, compare, setCompare, refreshing, onRefresh, dataLoading }){
  const labels = { overview:'Overview', apps:'Apps', ads:'Ad units', reviews:'Reviews', anomalies:'Anomalies', cohort:'Cohorts', sync:'Sync status' };
  const busy = refreshing || dataLoading;
  return (
    <div className="dx-top">
      <div className="dx-top-l">
        <div className="dx-crumb">
          <span>Workspace</span>
          <Icon name="chevR" size={12} color="rgba(230,232,239,0.3)"/>
          <span className="dx-crumb-cur">{labels[tab]}</span>
        </div>
        {dataLoading && (
          <span style={{marginLeft:12, fontSize:11, color:'oklch(0.72 0.14 240)', display:'inline-flex', alignItems:'center', gap:5}}>
            <Icon name="refresh" size={11} color="oklch(0.72 0.14 240)" style={{animation:'dx-spin .8s linear infinite'}}/>
            Fetching live data…
          </span>
        )}
      </div>
      <div className="dx-top-r">
        <div className="dx-seg">
          {DATE_RANGES.map(r=>(
            <button key={r.id} className={range===r.id?'on':''} onClick={()=>setRange(r.id)}>{r.label}</button>
          ))}
        </div>
        <select className="dx-select" value={appFilter} onChange={e=>setAppFilter(e.target.value)}>
          <option value="all">All apps</option>
          {window.XZ.APPS.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
        </select>
        <select className="dx-select" value={platform} onChange={e=>setPlatform(e.target.value)}>
          <option value="all">All platforms</option>
          <option value="android">Android</option>
          <option value="ios">iOS</option>
        </select>
        <button className={'dx-toggle '+(compare?'on':'')} onClick={()=>setCompare(!compare)}>
          <Icon name="chart" size={13}/> Compare prev.
        </button>
        <button className="dx-btn-ghost" onClick={onRefresh} disabled={busy}>
          <Icon name="refresh" size={13} style={{animation: busy?'dx-spin .8s linear infinite':'none'}}/>
          {busy ? 'Syncing…' : 'Refresh'}
        </button>
        <button className="dx-btn"><Icon name="download" size={13}/> Export CSV</button>
      </div>
    </div>
  );
}

function Overview({ apps, days, totalRev, totalRevP, admob, admobP, play, installs, installsP, dau, ratingAvg, crash, impr, ecpm, revSeries, installsSeries, installsSeriesP, compare, setDrilldown }){

  <script type="text/babel" data-presets="env,react">

// ── Real data loader ─────────────────────────────────────────────────────────
async function loadRealData(token) {
  const h = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
  const cfg = window.CONFIG;
  const out = { admobEarnings: {}, reviews: null, crashRates: {}, syncStatus: {} };

  console.log('[XZ] loadRealData start — packages:', cfg.packages);

  // ── AdMob: app list → earnings by app/day ────────────────────────────────
  if (!cfg.admobPublisherId.startsWith('REPLACE')) {
    console.log('[XZ] AdMob: fetching app list for', cfg.admobPublisherId);
    try {
      const appsResp = await fetch(
        `https://admob.googleapis.com/v1/accounts/${cfg.admobPublisherId}/apps?pageSize=100`,
        { headers: h }
      );
      console.log('[XZ] AdMob apps response status:', appsResp.status);
      const admobAppsBody = appsResp.ok ? await appsResp.json() : {};
      if (!appsResp.ok) console.error('[XZ] AdMob apps error body:', admobAppsBody);
      const admobApps = admobAppsBody.apps || [];
      const admobAppsSummary = admobApps.map(a => ({
        appId: a.appId,
        name: a.manualAppInfo?.displayName,
        androidPkg: a.linkedAppInfo?.androidAppId,
        iosBundleId: a.linkedAppInfo?.appStoreId,
      }));
      console.log('[XZ] AdMob: found', admobApps.length, 'apps:', admobAppsSummary);

      const pkgToId = {};
      Object.entries(cfg.packages).forEach(([id, pkg]) => { pkgToId[pkg] = id; });
      const admobIdToXz = {};
      admobApps.forEach(a => {
        const pkg = a.linkedAppInfo?.androidAppId;
        if (pkg && pkgToId[pkg] && a.appId) admobIdToXz[a.appId] = pkgToId[pkg];
      });
      console.log('[XZ] AdMob: ID→XZ mapping:', admobIdToXz);
      if (!Object.keys(admobIdToXz).length)
        console.warn('[XZ] AdMob: mapping empty — compare androidPkg values above with CONFIG.packages');

      const end = new Date();
      const start = new Date(Date.now() - 89 * 864e5);
      const fmt = d => ({ year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() });
      console.log('[XZ] AdMob: fetching network report', fmt(start), '→', fmt(end));
      const rptResp = await fetch(
        `https://admob.googleapis.com/v1/accounts/${cfg.admobPublisherId}/networkReport:generate`,
        { method: 'POST', headers: h, body: JSON.stringify({
            reportSpec: {
              dateRange: { startDate: fmt(start), endDate: fmt(end) },
              dimensions: ['APP', 'DATE'],
              metrics: ['ESTIMATED_EARNINGS', 'IMPRESSIONS', 'IMPRESSION_RPM'],
              sortConditions: [{ dimension: 'DATE', order: 'ASCENDING' }],
              localizationSettings: { currencyCode: 'SEK' },
            }
          })
        }
      );
      console.log('[XZ] AdMob report response status:', rptResp.status);
      if (rptResp.ok) {
        const text = await rptResp.text();
        let items = [];
        try { const p = JSON.parse(text); items = Array.isArray(p) ? p : [p]; }
        catch { items = text.trim().split('\n').map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean); }
        const dataRows = items.filter(o => o?.row);
        console.log('[XZ] AdMob: parsed', items.length, 'items,', dataRows.length, 'data rows');
        dataRows.forEach(({ row }) => {
          const dims = row.dimensionValues || {};
          const admobAppId = dims.APP?.value;
          const dateVal = dims.DATE?.value;
          const ourId = admobIdToXz[admobAppId];
          if (!ourId || !dateVal) return;
          if (!out.admobEarnings[ourId]) out.admobEarnings[ourId] = {};
          const mv = row.metricValues || {};
          out.admobEarnings[ourId][dateVal] = {
            earn: (parseInt(mv.ESTIMATED_EARNINGS?.microsValue ?? 0)) / 1e6,
            impr: parseInt(mv.IMPRESSIONS?.integerValue ?? 0),
            ecpm: (parseInt(mv.IMPRESSION_RPM?.microsValue ?? 0)) / 1e6,
          };
        });
        const summary = Object.entries(out.admobEarnings).map(([id, days]) => ({
          id, days: Object.keys(days).length,
          total30: Object.entries(days).slice(-30).reduce((s,[,v]) => s + v.earn, 0).toFixed(2),
        }));
        console.log('[XZ] AdMob: earnings by app (last 30d):', summary);
        out.syncStatus.admob = { ok: true };
      } else {
        const errBody = await rptResp.text();
        console.error('[XZ] AdMob report error:', errBody);
        out.syncStatus.admob = { ok: false };
      }
    } catch(e) {
      console.error('[XZ] AdMob API exception:', e);
      out.syncStatus.admob = { ok: false };
    }
  } else {
    console.log('[XZ] AdMob: skipped — publisherId not configured');
  }

  // ── Reviews (Android Publisher) ──────────────────────────────────────────
  const allReviews = [];
  for (const [id, pkg] of Object.entries(cfg.packages)) {
    if (pkg.startsWith('REPLACE')) continue;
    console.log(`[XZ] Reviews: fetching for ${id} (${pkg})`);
    try {
      const r = await fetch(
        `https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${pkg}/reviews?maxResults=10&translationLanguage=en`,
        { headers: h }
      );
      console.log(`[XZ] Reviews: ${pkg} → status ${r.status}`);
      if (r.ok) {
        const data = await r.json();
        const count = data.reviews?.length || 0;
        console.log(`[XZ] Reviews: ${pkg} → ${count} reviews`);
        (data.reviews || []).forEach(rv => {
          const c = rv.comments?.[0]?.userComment;
          if (!c?.text) return;
          const ageH = c.lastModified?.seconds
            ? Math.floor((Date.now() / 1000 - c.lastModified.seconds) / 3600) : 0;
          allReviews.push({
            app: id,
            stars: c.starRating || 0,
            who: rv.authorName || 'Anonymous',
            when: ageH < 24 ? `${ageH}h` : `${Math.floor(ageH / 24)}d`,
            body: (c.text || '').slice(0, 300),
            sent: c.starRating >= 4 ? 'pos' : c.starRating <= 2 ? 'neg' : 'neu',
          });
        });
        out.syncStatus.reviews = { ok: true };
      } else {
        const errBody = await r.text();
        console.warn(`[XZ] Reviews: ${pkg} error body:`, errBody);
      }
    } catch(e) { console.error(`[XZ] Reviews exception for ${pkg}:`, e); }
  }
  if (allReviews.length) out.reviews = allReviews.slice(0, 24);
  console.log('[XZ] Reviews: total collected:', allReviews.length);

  // ── Crash rates (Play Developer Reporting) ───────────────────────────────
  const end = new Date();
  const startCrash = new Date(Date.now() - 89 * 864e5);
  const fmtDT = d => ({ year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate(), timeZone: { id: 'UTC' } });
  for (const [id, pkg] of Object.entries(cfg.packages)) {
    if (pkg.startsWith('REPLACE')) continue;
    console.log(`[XZ] Crash rates: fetching for ${id} (${pkg})`);
    try {
      const r = await fetch(
        `https://playdeveloperreporting.googleapis.com/v1beta1/apps/${encodeURIComponent(pkg)}/crashRateMetricSet:query`,
        { method: 'POST', headers: h, body: JSON.stringify({
            timelineSpec: { aggregationPeriod: 'DAILY', startTime: fmtDT(startCrash), endTime: fmtDT(end) },
            dimensions: [],
            metrics: ['crashRate'],
            pageSize: 90,
          })
        }
      );
      console.log(`[XZ] Crash rates: ${pkg} → status ${r.status}`);
      if (r.ok) {
        const data = await r.json();
        const rowCount = data.rows?.length || 0;
        console.log(`[XZ] Crash rates: ${pkg} → ${rowCount} rows`);
        if (rowCount) {
          out.crashRates[id] = data.rows.map(row => {
            const m = (row.metrics || []).find(x => x.metric === 'crashRate');
            return parseFloat(m?.decimalValue ?? '0') * 100;
          });
        }
      } else {
        const errBody = await r.text();
        console.warn(`[XZ] Crash rates: ${pkg} error:`, errBody);
      }
    } catch(e) { console.error(`[XZ] Crash rates exception for ${pkg}:`, e); }
  }

  console.log('[XZ] loadRealData done:', {
    admobApps: Object.keys(out.admobEarnings).length,
    reviews: out.reviews?.length ?? 0,
    crashApps: Object.keys(out.crashRates).length,
    syncStatus: out.syncStatus,
  });
  return out;
}

function applyRealData(updates) {
  const XZ = window.XZ;
  const HORIZON = XZ.HORIZON;
  const today = new Date();

  console.log('[XZ] applyRealData:', {
    admobApps: Object.keys(updates.admobEarnings).length,
    reviews: updates.reviews?.length ?? 0,
    crashApps: Object.keys(updates.crashRates).length,
  });

  if (updates.reviews?.length) {
    XZ.REVIEWS = updates.reviews;
    console.log('[XZ] Applied', updates.reviews.length, 'reviews');
  }

  Object.entries(updates.admobEarnings).forEach(([id, byDate]) => {
    const app = XZ.APPS.find(a => a.id === id);
    if (!app) return;
    const newAdmob = new Array(HORIZON).fill(0);
    const newImpr  = new Array(HORIZON).fill(0);
    const newEcpm  = new Array(HORIZON).fill(0);
    Object.entries(byDate).forEach(([ds, { earn, impr, ecpm }]) => {
      const y = +ds.slice(0,4), mo = +ds.slice(4,6)-1, d = +ds.slice(6,8);
      const daysAgo = Math.round((today - new Date(y, mo, d)) / 864e5);
      const idx = HORIZON - 1 - daysAgo;
      if (idx >= 0 && idx < HORIZON) { newAdmob[idx] = earn; newImpr[idx] = impr; newEcpm[idx] = ecpm; }
    });
    app.series.admob = newAdmob;
    app.series.impr  = newImpr;
    app.series.ecpm  = newEcpm;
    app.rev30 = newAdmob.slice(-30).reduce((s, v) => s + v, 0);
    console.log(`[XZ] Applied AdMob for ${id}: rev30=${app.rev30.toFixed(0)} kr`);
  });

  Object.entries(updates.crashRates).forEach(([id, series]) => {
    const app = XZ.APPS.find(a => a.id === id);
    if (!app || !series.length) return;
    const padded = new Array(HORIZON).fill(series[0] || 0);
    series.forEach((v, i) => { const idx = HORIZON - series.length + i; if (idx >= 0) padded[idx] = v; });
    app.series.crashRate = padded;
    app.crash = series[series.length - 1] ?? app.crash;
    console.log(`[XZ] Applied crash rate for ${id}: latest=${app.crash.toFixed(3)}%`);
  });

  const nowStr = new Date().toLocaleTimeString('en', { hour: '2-digit', minute: '2-digit' });
  XZ.SYNC_SOURCES = XZ.SYNC_SOURCES.map(s => {
    if (s.name.includes('AdMob'))
      return { ...s, last: updates.syncStatus.admob?.ok ? nowStr : 'failed', status: updates.syncStatus.admob?.ok ? 'ok' : 'error' };
    if (s.name.includes('Reporting'))
      return { ...s, last: Object.keys(updates.crashRates).length ? nowStr : s.last, status: Object.keys(updates.crashRates).length ? 'ok' : 'error' };
    if (s.name.includes('Android Publisher'))
      return { ...s, last: updates.syncStatus.reviews?.ok ? nowStr : 'failed', status: updates.syncStatus.reviews?.ok ? 'ok' : 'error' };
    return s;
  });
  console.log('[XZ] applyRealData done — sync sources updated');
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [user,        setUser]        = React.useState(null);
  const [dataLoading, setDataLoading] = React.useState(false);
  const [dataKey,     setDataKey]     = React.useState(0);

  const handleSignIn = React.useCallback(async (userData) => {
    setUser(userData);
    if (userData.token) {
      setDataLoading(true);
      try {
        const updates = await loadRealData(userData.token);
        applyRealData(updates);
        setDataKey(k => k + 1);
      } catch(e) {
        console.warn('Real data load failed:', e);
      }
      setDataLoading(false);
    }
  }, []);

  return user
    ? <Dashboard key={dataKey} user={user}
                 onSignOut={() => setUser(null)}
                 onBackToSite={() => { window.location.href = 'index.html'; }}
                 dataLoading={dataLoading}/>
    : <LoginScreen onSignIn={handleSignIn}
                   onBack={() => { window.location.href = 'index.html'; }}/>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
  </script>
</body>
